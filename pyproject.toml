[project]
name = "ihike"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roey Ben Arieh", email = "roey280404@gmail.com" }
]
requires-python = ">=3.14"

[project.optional-dependencies]
pymongo    = ["pymongo>=4.16.0"]
redis      = ["redis>=7.4.0"]
sqlalchemy = ["sqlalchemy>=2.0.49", "psycopg[binary]>=3.0"]
kafka      = ["confluent-kafka>=2.5.0"]
rabbitmq   = ["pika>=1.3.0"]
all        = ["ihike[pymongo,redis,sqlalchemy,kafka,rabbitmq]"]

[tool.pyright]
typeCheckingMode = "strict"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hike"

[tool.coverage.run]
source = ["hike"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[dependency-groups]
dev = [
    "ihike[all]",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "testcontainers[mongodb,postgres,redis]>=4.15.0",
    "confluent-kafka>=2.5.0",
    "pika>=1.3.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
