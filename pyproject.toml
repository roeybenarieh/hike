[project]
name = "hike"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roey Ben Arieh", email = "roey280404@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "py-assimilator>=1.3.1",
]

[project.optional-dependencies]
pymongo    = ["pymongo>=4.16.0"]
redis      = ["redis>=7.4.0"]
sqlalchemy = ["sqlalchemy>=2.0.49", "psycopg[binary]>=3.0"]
all        = ["hike[pymongo,redis,sqlalchemy]"]

[tool.pyright]
typeCheckingMode = "strict"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hike[all]",
    "pytest>=9.0.3",
    "testcontainers[mongodb,postgres,redis]>=4.15.0",
]
